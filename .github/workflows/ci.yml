name: "🧪 CI"
run-name: "🧪 Validar código · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"

jobs:
  detect_ci_scope:
    name: "🔎 00 · Detectar escopo do PR"
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.detect.outputs.ci_required }}
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ci_required=false
          changed_files="$(mktemp)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          if [ ! -s "$changed_files" ]; then
            echo "No changed files found. Running full CI for safety."
            ci_required=true
          else
            echo "Changed files:"
            cat "$changed_files"
            if [ -d infra/terraform ]; then
              while IFS= read -r file; do
                case "$file" in
                  *.md) ;;
                  *) ci_required=true; break ;;
                esac
              done < "$changed_files"
            else
              echo "Terraform directory is not present yet; heavy validation is safely deferred during bootstrap."
            fi
          fi
          echo "ci_required=$ci_required" >> "$GITHUB_OUTPUT"
  validate_git_flow:
    name: "🔀 01 · Validar fluxo de branches"
    runs-on: ubuntu-latest
    steps:
      - name: "🔀 01 · Conferir origem e destino do PR"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"
          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                main|release|release/*) echo "Protected stage branches must not open pull requests back to develop."; exit 1 ;;
                *) echo "Pull request to develop follows the Git Flow entry point." ;;
              esac ;;
            release|release/*)
              if [ "$HEAD_BRANCH" != "develop" ]; then echo "Pull requests to release must come from develop."; exit 1; fi
              echo "Pull request to release follows the Git Flow promotion path." ;;
            main)
              case "$HEAD_BRANCH" in release|release/*) echo "Pull request to main follows the Git Flow production promotion path." ;; *) echo "Pull requests to main must come from release or release/*."; exit 1;; esac ;;
            *) echo "Unsupported protected base branch: $BASE_BRANCH"; exit 1 ;;
          esac
  validate_terraform:
    name: "🌐 02 · Validar Terraform do API Gateway"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
      - name: "🛠️ 02 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: "🧪 Validar bloqueio de AWS sem laboratório"
        run: |
          node <<'TESTAR_BLOQUEIO_AWS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const ler = nome => fs.readFileSync('.github/workflows/' + nome, 'utf8').replace(/\r\n/g, '\n');
          const deploy = ler('aws-deploy.yml');
          const cd = ler('cd-development.yml');
          const bash = process.platform === 'win32' ? 'C:/Program Files/Git/bin/bash.exe' : 'bash';
          const gate = texto => {
            const bloco = texto.match(/      - name: "🛡️ Conferir habilitação do deploy AWS"\n([\s\S]*?)(?=      - name:|$)/);
            assert(bloco, 'Barreira de AWS ausente.');
            assert(bloco[1].includes('DEPLOY_ENABLED: \u0024{{ vars.AWS_DEPLOY_ENABLED }}'));
            const script = bloco[1].split('        run: |\n')[1];
            assert(script, 'Validação executável ausente.');
            return script.split('\n').map(l => l.slice(10)).join('\n').trim();
          };
          function conferirBloqueio(texto) {
            const script = gate(texto);
            function executar(flag, ref = 'refs/heads/develop', ambiente = 'development') {
              const env = { ...process.env, GITHUB_REF: ref, DEPLOY_ENVIRONMENT: ambiente };
              delete env.DEPLOY_ENABLED;
              if (flag !== undefined) env.DEPLOY_ENABLED = flag;
              const resultado = cp.spawnSync(bash, ['-e', '-c', script], { env, encoding: 'utf8' });
              assert.ifError(resultado.error);
              return resultado.status;
            }
            for (const valor of [undefined, '', 'false', 'TRUE', 'true ']) {
              assert.notEqual(executar(valor), 0, 'Valor deve bloquear: ' + valor);
            }
            assert.equal(executar('true'), 0);
            for (const ref of ['refs/heads/main', 'refs/heads/release', 'refs/heads/feature/teste', 'refs/tags/develop']) {
              assert.notEqual(executar('true', ref), 0, 'Ref indevida deve bloquear.');
            }
            assert.notEqual(executar('true', 'refs/heads/develop', 'production'), 0);
            assert.notEqual(executar('true', 'refs/heads/develop', ''), 0);
          }
          conferirBloqueio(deploy);
          assert(deploy.includes('DEPLOY_ENVIRONMENT: \u0024{{ inputs.environment_name }}'), 'Barreira deve conferir o Environment solicitado.');
          assert(deploy.indexOf('🛡️ Conferir habilitação do deploy AWS') < deploy.indexOf('id: resolve'), 'Resolver ação somente após a barreira.');
          for (const nome of ['prepare_and_plan', 'apply_or_destroy']) {
            const job = deploy.split('\n  ' + nome + ':')[1]?.split(/\n  [a-z_]+:/)[0];
            assert(job && /needs:[\s\S]*?resolve_action/.test(job), 'Job AWS deve depender da barreira.');
          }
          if (fs.existsSync('.github/workflows/datadog-observability.yml')) {
            const datadog = ler('datadog-observability.yml');
            conferirBloqueio(datadog);
            const job = datadog.split('\n  deploy-datadog:')[1];
            assert(job.includes("if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop'"));
            assert(datadog.indexOf('🛡️ Conferir habilitação do deploy AWS') < datadog.indexOf('aws-actions/configure-aws-credentials'), 'Datadog deve bloquear antes das credenciais.');
            assert(cd.includes("vars.AWS_DEPLOY_ENABLED == 'true'"), 'Caller do Datadog deve preservar a barreira.');
          } else {
            const job = cd.split('\n  deploy-development:')[1].split('\n  open-pr-to-release:')[0];
            assert(job.includes("if: needs.detect-deploy-scope.outputs.deploy_required == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'"), 'Caller deve exigir flag e mudança implantável.');
          }
          console.log('Barreira AWS: ausência/false bloqueiam; true exige develop/development; caller e callee protegidos, sem consulta AWS.');
          TESTAR_BLOQUEIO_AWS

      - name: "🧪 Validar recuperação segura de destroy"
        run: node --test .github/scripts/*.test.cjs

      - name: "🎨 03 · Verificar formatação Terraform"
        run: terraform fmt -check -recursive infra/terraform
      - name: "🚀 04 · Inicializar Terraform sem backend"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false
      - name: "🔍 05 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate
  quality_gate:
    name: "🚦 03 · Quality gate"
    needs: [detect_ci_scope, validate_git_flow, validate_terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "🚦 01 · Conferir status de todos os jobs do CI"
        run: |
          if [ "${{ needs.detect_ci_scope.result }}" != "success" ]; then echo "CI scope detection failed."; exit 1; fi
          if [ "${{ needs.validate_git_flow.result }}" != "success" ]; then echo "Git Flow branch validation failed."; exit 1; fi
          if [ "${{ needs.detect_ci_scope.outputs.ci_required }}" != "true" ]; then echo "Only documentation or bootstrap files changed. Heavy CI skipped safely."; exit 0; fi
          if [ "${{ needs.validate_terraform.result }}" != "success" ]; then echo "Terraform validation failed."; exit 1; fi
          echo "All CI responsibilities passed."
